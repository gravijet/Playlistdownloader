# yt.benjaminberger.at — Playlist Downloader.
# Behind Cloudflare (proxied AAAA): edge TLS to the browser, LE cert to the origin.
# Port 80 stays open so ACME webroot renewals keep working.

upstream ytdlweb {
    server 127.0.0.1:8090 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name yt.benjaminberger.at;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yt.benjaminberger.at;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yt.benjaminberger.at;

    ssl_certificate     /etc/letsencrypt/live/yt.benjaminberger.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.benjaminberger.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/yt.benjaminberger.at.access.log;
    error_log  /var/log/nginx/yt.benjaminberger.at.error.log;

    # No uploads happen here; keep request bodies tiny.
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yt.benjaminberger.at;
        default_type "text/plain";
    }

    # The finished ZIP. Streamed straight through: buffering a multi-hundred-MB
    # response to disk first would only add latency and I/O.
    location ~ ^/api/jobs/[^/]+/download$ {
        proxy_pass http://ytdlweb;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        send_timeout 1800s;
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        proxy_pass http://ytdlweb;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Always revalidate (ETag/Last-Modified -> 304 if unchanged) instead
        # of a blind 1h cache: static files have no version/hash in their
        # name, so a blind cache meant a deployed fix could sit invisible in
        # a visitor's browser for up to an hour. Revalidation costs a small
        # conditional request instead of none, but picks up changes at once.
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://ytdlweb;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Status polls are quick; downloads have their own location above.
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
