<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anmelden · Playlist Downloader</title>
<link rel="stylesheet" href="/static/style.css?v=20260920b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>Downloader</h1>
    <p class="sub">Diese Instanz ist passwortgeschützt.</p>
    <form class="card" id="login">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" required autofocus>
      <button type="submit">Anmelden</button>
      <div class="error" id="err" role="alert" hidden></div>
    </form>
  </div>
</div>
<script>
const form = document.getElementById('login');
const err  = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.hidden = true;
  const btn = form.querySelector('button');
  btn.disabled = true; btn.textContent = 'Prüfe…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value})
    });
    if (r.ok) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.detail || 'Anmeldung fehlgeschlagen.';
    err.hidden = false;
  } catch {
    err.textContent = 'Server nicht erreichbar.';
    err.hidden = false;
  }
  btn.disabled = false; btn.textContent = 'Anmelden';
});
</script>
</body>
</html>
